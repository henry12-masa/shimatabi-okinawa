<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="sky12" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#8de8ff"/>
<stop offset="100%" stop-color="#0e7c9d"/>
</linearGradient>
</defs>
<rect width="400" height="300" fill="url(#sky12)"/>
<circle cx="70" cy="55" r="24" fill="#fff4d6"/>
<!-- sea gradient bands -->
<rect y="150" width="400" height="150" fill="#0e7c9d"/>
<rect y="170" width="400" height="130" fill="#3fc8b0" opacity="0.5"/>
<rect y="200" width="400" height="100" fill="#4fc3d9" opacity="0.5"/>
