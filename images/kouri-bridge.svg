<!-- island right -->
<ellipse cx="390" cy="170" rx="50" ry="26" fill="#3fc8b0"/>
<!-- bridge -->
<path d="M60 205 Q200 170 370 190" fill="none" stroke="#f7f0dd" stroke-width="14"/>
<path d="M60 205 Q200 170 370 190" fill="none" stroke="#dfe6e9" stroke-width="6"/>
<!-- bridge pillars -->
