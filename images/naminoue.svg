<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#4fc3d9"/>
<stop offset="100%" stop-color="#0e7c9d"/>
</linearGradient>
</defs>
<rect width="400" height="300" fill="url(#sky4)"/>
<circle cx="70" cy="60" r="22" fill="#ffffff" opacity="0.9"/>
<!-- sea -->
